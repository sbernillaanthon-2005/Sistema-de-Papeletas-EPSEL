services:
  # ─────────────────────────────────────────────
  #  PHP-FPM (Laravel app)
  # ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    container_name: epsel_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./openspec:/var/www/html/openspec:ro
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    command: php-fpm
    environment:
      - APP_ENV=${APP_ENV:-local}
    networks:
      - epsel_net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'echo \"ok\";'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  #  Nginx (reverse proxy)
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: epsel_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8000}:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - epsel_net
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────
  #  PostgreSQL 16
  # ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: epsel_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-epsel_papeletas}
      POSTGRES_USER: ${DB_USERNAME:-epsel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - epsel_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-epsel} -d ${DB_DATABASE:-epsel_papeletas}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────
  #  pgAdmin 4
  # ─────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: epsel_pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@epsel.pe}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - epsel_net
    depends_on:
      db:
        condition: service_healthy

  # ─────────────────────────────────────────────
  #  Laravel Reverb (WebSockets)
  # ─────────────────────────────────────────────
  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    container_name: epsel_reverb
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080 --debug
    ports:
      - "${REVERB_PORT:-8080}:8080"
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    networks:
      - epsel_net
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit((int)!@fsockopen('127.0.0.1', 8080));"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  #  Queue Worker
  # ─────────────────────────────────────────────
  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    container_name: epsel_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    networks:
      - epsel_net
    depends_on:
      app:
        condition: service_healthy

  # ─────────────────────────────────────────────
  #  Node / Vite (desarrollo frontend)
  # ─────────────────────────────────────────────
  node:
    image: node:22-alpine
    container_name: epsel_node
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./src:/var/www/html
    networks:
      - epsel_net
    depends_on:
      - app

networks:
  epsel_net:
    driver: bridge

volumes:
  pgdata:
  pgadmin_data:
